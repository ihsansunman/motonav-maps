# Aylık veri hattı: Türkiye haritası, rota ve arama paketleri (pipeline/monthly.sh), sonra Release + regions.json.
# Elle çalıştırmada "publish" kapalıysa yalnızca üretir ve boyutları özetler (deneme).
name: Aylık veri
on:
  schedule:
    - cron: "0 2 5 * *" # her ayın 5'i, 02:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: Release ve katalogu yayınla
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: monthly-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Disk aç (runner'daki kullanılmayan araçlar)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Üret
        run: pipeline/monthly.sh "$RUNNER_TEMP/work"
      - name: Yayınla
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipeline/publish.sh "$RUNNER_TEMP/work"
